[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# orchestrator.py's SYSTEM_PROMPT must stay byte-for-byte verbatim with claude.md §8 —
# reformatting it to fit line-length would violate that.
[tool.ruff.lint.per-file-ignores]
"app/services/orchestrator.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app", "migrations"]
ignore_missing_imports = true
disallow_untyped_defs = false
